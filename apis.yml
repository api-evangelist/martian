aid: martian
name: Martian
description: >-
  Martian operates the Martian Gateway, a unified LLM API that provides access
  to 200+ AI models from leading providers (OpenAI, Anthropic, and others)
  through a single OpenAI- and Anthropic-compatible endpoint. Developers point
  the standard OpenAI or Anthropic SDK at https://api.withmartian.com/v1,
  authenticate with a bearer API key, and call models using a
  provider/model-name identifier, with real-time pricing, a usage dashboard, and
  model routing across providers. Martian is also an AI interpretability research
  organization, publishing open-source frameworks such as ARES (Agentic Research
  and Evaluation Suite), K-Steering, RouterBench, and a model-router / judges SDK.
