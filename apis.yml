  description: >-
    Unified, OpenAI- and Anthropic-compatible LLM gateway providing access to
    200+ models from leading providers through a single endpoint. Documented
    operations: POST /v1/chat/completions (OpenAI-compatible), POST /v1/messages
    (Anthropic-compatible), and GET /v1/models (List Models). Bearer API key
    authentication; models are addressed as provider/model-name.
